{{- with site.Params.giscus }}
{{- if and .repo .repoId .category .categoryId }}
<div class="post-comments" tabindex="-1">
  <div class="comments-consent">
    <p>Comments are hosted on GitHub via giscus. Loading them sends the browser's IP address to giscus.app and GitHub.</p>
    <button type="button" class="comments-load">Load comments</button>
  </div>
</div>
<script>
  document.querySelector(".comments-load").addEventListener("click", function () {
    document.querySelector(".comments-consent").remove();
    document.querySelector(".post-comments").focus();
    function giscusTheme() {
      return document.documentElement.dataset.theme === "dark" ? "transparent_dark" : "light";
    }
    var g = document.createElement("script");
    g.src = "https://giscus.app/client.js";
    g.async = true;
    g.crossOrigin = "anonymous";
    var attrs = {
      "data-repo": {{ .repo }},
      "data-repo-id": {{ .repoId }},
      "data-category": {{ .category }},
      "data-category-id": {{ .categoryId }},
      "data-mapping": "pathname",
      "data-strict": "0",
      "data-reactions-enabled": "1",
      "data-emit-metadata": "0",
      "data-input-position": "bottom",
      "data-lang": "en",
      "data-loading": "lazy",
      "data-theme": giscusTheme()
    };
    Object.keys(attrs).forEach(function (k) { g.setAttribute(k, attrs[k]); });
    document.querySelector(".post-comments").appendChild(g);
    new MutationObserver(function () {
      var frame = document.querySelector("iframe.giscus-frame");
      if (!frame) return;
      frame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: giscusTheme() } } },
        "https://giscus.app"
      );
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  });
</script>
{{- end }}
{{- end }}
